<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0614">
  <meta name="robots" content="noindex">
  <title>Régie · Little Miss Party Quiz</title>
  <link rel="stylesheet" href="regie.css">
</head>
<body>
  <div id="offline" class="banner" hidden>Reconnexion…</div>
  <main>
    <section id="screen-loading" class="screen active">
      <p class="brand">Little Miss Party · Régie</p>
      <p class="hint">Connexion…</p>
    </section>

    <section id="screen-error" class="screen">
      <p class="brand">Régie</p>
      <p id="error-text" class="hint"></p>
      <button id="retry" class="btn">Réessayer</button>
    </section>

    <section id="screen-pair" class="screen">
      <p class="brand">Little Miss Party · Régie</p>
      <h1>Relier ce téléphone à la TV</h1>
      <label for="pair-code">Code de la partie</label>
      <input id="pair-code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE">
      <label for="pair-pin">Code à 4 chiffres affiché sur la TV</label>
      <input id="pair-pin" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" placeholder="••••">
      <p id="pair-status" class="hint"></p>
      <button id="pair-go" class="btn main">Relier</button>
    </section>

    <section id="screen-control" class="screen control">
      <header class="top">
        <span id="c-dot" class="dot on"></span>
        <span id="c-code" class="code"></span>
        <span id="c-step" class="step"></span>
        <span id="c-timer" class="timer"></span>
      </header>

      <div class="card">
        <p id="c-phase" class="phase"></p>
        <p id="c-question" class="question"></p>
        <button id="c-answer" class="answer" aria-label="Afficher ou masquer la bonne réponse"></button>
        <p id="c-answered" class="hint small"></p>
      </div>

      <nav class="tabs">
        <button id="tab-teams" class="tab active">Équipes</button>
        <button id="tab-plan" class="tab">Conducteur</button>
      </nav>
      <div id="panel-teams" class="panel"></div>
      <div id="panel-plan" class="panel" hidden></div>

      <div id="toast" class="toast" hidden></div>
      <div id="undo" class="undo" hidden><span id="undo-text"></span><button id="undo-go">Annuler</button></div>

      <footer class="actions">
        <div class="row">
          <button id="c-pause" class="btn secondary">Pause</button>
          <button id="c-end" class="btn danger hold" title="Appui long pour terminer la partie"><span class="fill"></span><span class="label">Terminer</span></button>
        </div>
        <button id="c-next" class="btn main"></button>
      </footer>
    </section>
  </main>
  <script type="module" src="regie.js"></script>
</body>
</html>
