# Banque des tout-petits : photos candidates du domaine public pour chaque mot, à choisir avant de les ajouter à
# web/public/banque/. Lancé à la main ; ne publie rien sur le site ni sur la TV.
# Résultat : une pré-version GitHub « banque-photos-candidats » (planches, candidates, sources), remplacée à chaque fois.
name: Banque photos (candidates)

on:
  workflow_dispatch:
    inputs:
      mots:
        description: "Seulement ces mots (clés séparées par des virgules), vide = tous"
        required: false
        default: ""
      lot:
        description: "Nom du lot (vide = le premier) : chaque lot a sa pré-version, les précédents sont gardés"
        required: false
        default: ""
      par_mot:
        description: "Nombre de photos candidates par mot"
        required: false
        default: "4"
      nettoyer:
        description: "« oui » = effacer toutes les pré-versions et branches de candidates (une fois les photos choisies)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: banque-photos-${{ inputs.lot }}
  cancel-in-progress: true

jobs:
  # Les candidates viennent de recherches automatiques : certaines ne conviennent pas à des enfants. Une fois le choix
  # fait (les photos retenues sont copiées dans web/public/banque/), on les efface du dépôt public.
  nettoyer:
    if: ${{ inputs.nettoyer == 'oui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Effacer les pré-versions, étiquettes et branches de candidates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list -R "$REPO" --limit 100 --json tagName -q '.[].tagName' | grep '^banque-photos-candidats'); do
            gh release delete "$tag" -R "$REPO" --yes --cleanup-tag
          done
          for ref in $(gh api "repos/$REPO/git/matching-refs/heads/banque-photos-candidats" -q '.[].ref') $(gh api "repos/$REPO/git/matching-refs/tags/banque-photos-candidats" -q '.[].ref'); do
            gh api -X DELETE "repos/$REPO/git/$ref"
          done
          echo "Restant :"; gh api "repos/$REPO/git/matching-refs/heads/banque-photos-candidats" -q '.[].ref'
  candidates:
    if: ${{ inputs.nettoyer != 'oui' }}
    runs-on: ubuntu-latest
    # 388 mots × 4 photos de 480 px (moins de 45 Ko chacune) : 70 Mo au plus ; une heure environ avec les pauses (quotas des API).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ImageMagick
        run: command -v convert && command -v montage || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - name: Chercher et recadrer les photos
        env:
          MOTS: ${{ inputs.mots }}
          PAR_MOT: ${{ inputs.par_mot }}
          BUDGET_MIN: "90"
        run: node scripts/banque-photos.mjs
      - name: Publier les candidates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: banque-photos-candidats${{ inputs.lot && format('-{0}', inputs.lot) || '' }}
        run: |
          cd banque-candidats
          rm -f ./*.orig
          zip -q candidates.zip ./*-[0-9].jpg sources.json
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Banque des tout-petits : photos candidates" \
            --notes "Photos du domaine public (Openverse, CC0 / PDM) à choisir. Outil interne : ne pas installer." \
            planche-*.jpg candidates.zip sources.json
      # Même contenu sur une branche à part (jamais fusionnée) : Claude la lit avec git pour choisir les photos.
      - name: Copier les candidates sur une branche
        env:
          BRANCHE: banque-photos-candidats${{ inputs.lot && format('-{0}', inputs.lot) || '' }}
        run: |
          cd banque-candidats
          rm -f candidates.zip
          git init -q -b "$BRANCHE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Photos candidates ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCHE"
