# Outro du robot : télécharge des sons libres (CC0, via Openverse) et les dépose sur une branche à part
# « sons-outro-candidats » (jamais fusionnée) que Claude lit avec git. Ne publie rien sur le site ni sur la TV.
name: Sons outro (candidats)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-6i3ebq]
    paths: [scripts/sons-outro.py, .github/workflows/sons-outro.yml]

permissions:
  contents: write

jobs:
  sons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les sons
        run: python3 scripts/sons-outro.py "$RUNNER_TEMP/sons"
      - name: Déposer sur la branche sons-outro-candidats
        run: |
          cd "$RUNNER_TEMP/sons"
          git init -q -b sons-outro-candidats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Sons CC0 pour l'outro ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/sons-outro-candidats"
