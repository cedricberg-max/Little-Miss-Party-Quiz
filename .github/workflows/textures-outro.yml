# Outro du robot : télécharge des matières PBR libres (CC0, ambientCG + Poly Haven) et les dépose sur une branche à part
# « textures-outro-candidats » (jamais fusionnée) que Claude lit avec git. Ne publie rien sur le site ni sur la TV.
name: Textures outro (candidates)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-6i3ebq]
    paths: [scripts/textures-outro.py, .github/workflows/textures-outro.yml]

permissions:
  contents: write

jobs:
  textures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les matières
        run: python3 scripts/textures-outro.py "$RUNNER_TEMP/textures"
      - name: Déposer sur la branche textures-outro-candidats
        run: |
          cd "$RUNNER_TEMP/textures"
          git init -q -b textures-outro-candidats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Matières CC0 pour l'outro ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/textures-outro-candidats"
