name: Rapports de la box

# Lancement manuel : affiche les rapports envoyés par les box (chemin reports/ de la base : plantages, incidents du
# son), illisibles depuis l'appli. Rien n'est modifié dans la base.
# Avec « captures » (numéro d'un passage des tests émulateur) : affiche à la place quelques captures de ce passage,
# réduites en JPEG et encodées en base64 dans le journal, pour les relire là où l'archive des tests n'est pas
# téléchargeable.
on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre de rapports à lire, les plus récents (1 à 1000)"
        default: "20"
      captures:
        description: "Numéro d'un passage « Tests Android (émulateur TV) » dont afficher les captures (vide = les rapports)"
        default: ""
      audit:
        description: "« packs » : vérifie les images de tous les packs et d'une prestation (champ « prestation ») ; « bombe » : journal de « Ça va exploser ! » de la dernière partie (ou du code donné dans « prestation ») ; « partie » : prestation chargée ou démonstration dans la dernière partie (« prestation » : un mot du titre à chercher) ; « journal » : déroulé complet de la dernière partie (ou du code dans « prestation »), heures UTC dans « quoi » (22:00-22:20). Sans rien modifier"
        default: ""
      prestation:
        description: "Avec audit : un mot du nom de la prestation à vérifier (ses questions à réponses en images)"
        default: ""
      touki:
        description: "Prestation de test : « apercu » ou « ecrire » (ajoute, ne remplace ni n'efface rien) ; « menage4 » liste ce qui serait effacé, « menage4ecrire » efface les prestations de test nommées dans quoi"
        default: ""
      quoi:
        description: "Avec touki : « guy » (Anniversaire Guy Georges, 1er/11), « diddy » (31/10) ; avec menage4ecrire, les prestations à effacer, séparées par des virgules"
        default: ""
      noms:
        description: "Captures à afficher, séparées par des virgules"
        default: "question-1,question-8-equipes,revelation,revelation-8-equipes,question-fermee,reponses-en-images,reponses-en-images-revelation,express-affirmation,zoom-mystere-question,zoom-mystere-revelation,image-floue-buzz,image-floue-revelation,juste-chiffre-question,juste-chiffre-revelation,quiz-musical-revelation,mimes-tour,mimes-6-equipes-tour"

permissions:
  contents: read

jobs:
  captures:
    if: inputs.captures != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      # Les planches (noms avec « * ») sont aussi poussées sur une branche à part, « captures-<passage> » : le journal
      # n'est pas toujours téléchargeable. Rien d'autre n'est écrit dans le dépôt.
      contents: write
    env:
      PASSAGE: ${{ inputs.captures }}
      NOMS: ${{ inputs.noms }}
    steps:
      - name: Vérifier le numéro du passage
        run: case "$PASSAGE" in *[!0-9]*) echo "Numéro de passage invalide" >&2; exit 1 ;; esac
      - uses: actions/download-artifact@v4
        with:
          name: tests-android-tv
          run-id: ${{ inputs.captures }}
          github-token: ${{ github.token }}
          path: archive
      - name: Tests en échec dans ce passage
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("archive/**/TEST-*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  e = tc.find("failure")
                  if e is not None:
                      print("---", tc.get("classname").split(".")[-1], tc.get("name"))
                      print("\n".join((e.text or "").splitlines()[:25]))
          PY
      - name: Afficher les captures
        run: |
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null; }
          echo "== Toutes les captures du passage =="
          find archive -name '*.png' -printf '%f\n' | sort
          # Une capture s'appelle « <Test>-<n°>-<nom>.png » ; un même nom peut venir de plusieurs tests. Le nom d'un test
          # à paramètres contient des espaces (« [3 équipes] ») : lu ligne à ligne. Un nom avec « * » (ex. « tour-* »)
          # prend toutes les captures qui correspondent, plus petites (planche des 1 à 8 équipes).
          set -f
          for nom in $(printf '%s' "$NOMS" | tr ',' ' '); do
            case "$nom" in *[!a-zA-Z0-9*-]*) echo "Nom ignoré : $nom"; continue ;; esac
            case "$nom" in *'*'*) combien=400; taille='640x>'; qualite=60 ;; *) combien=3; taille='960x>'; qualite=72 ;; esac
            trouve=
            while IFS= read -r png; do
              [ -n "$png" ] || continue
              trouve=1
              fichier=$(basename "$png" .png | tr -c 'a-zA-Z0-9.\n-' '_')
              convert "$png" -resize "$taille" -quality "$qualite" "$RUNNER_TEMP/$fichier.jpg"
              echo "=== CAPTURE $fichier $(identify -format '%wx%h' "$png") $(wc -c < "$RUNNER_TEMP/$fichier.jpg")"
              case "$nom" in
                *'*'*) mkdir -p "$RUNNER_TEMP/planche" && cp "$RUNNER_TEMP/$fichier.jpg" "$RUNNER_TEMP/planche/" ;;
                *) base64 -w 1000 "$RUNNER_TEMP/$fichier.jpg" | sed 's/^/B64 /' ;;
              esac
              echo "=== FIN $fichier"
            done < <(find archive \( -name "*-[0-9][0-9]-$nom.png" -o -name "$nom.png" \) | sort | head -"$combien")
            [ -n "$trouve" ] || echo "=== ABSENTE $nom"
          done
      - name: Rapport du tour des écrans (1 à 8 équipes)
        if: contains(inputs.noms, 'tour')
        run: |
          mkdir -p "$RUNNER_TEMP/planche"
          find archive -name 'logcat.txt' -exec grep -h 'TOUR|' {} + | sed 's/^.*TOUR|/TOUR|/' | sort -u | tee "$RUNNER_TEMP/planche/tour.txt" || echo "=== ABSENT rapport du tour"
      - name: Pousser la planche sur sa branche
        if: contains(inputs.noms, '*')
        run: |
          [ -d "$RUNNER_TEMP/planche" ] || { echo "Pas de planche"; exit 0; }
          cd "$RUNNER_TEMP/planche"
          git init -q -b "captures-$PASSAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Captures du passage $PASSAGE des tests émulateur"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "captures-$PASSAGE"
          echo "Branche captures-$PASSAGE : $(ls | wc -l) fichiers"
      - name: Afficher les films (aperçus)
        if: contains(inputs.noms, 'apercu')
        run: |
          for mp4 in $(find archive -name '*apercu*.mp4' | sort | head -2); do
            echo "=== VIDEO $(basename "$mp4") $(wc -c < "$mp4")"
            base64 -w 4000 "$mp4" | sed 's/^/V64 /'
            echo "=== FIN VIDEO"
          done

      # Le film du podium image par image (PodiumFilmTest) : textes sur fond noir puis sur fond blanc, en vidéo RVB
      # quasi sans perte ; l'incrustation sur les vraies vidéos et la musique se fait ensuite, hors du journal.
      - name: Afficher le film du podium (images pas à pas)
        if: contains(inputs.noms, 'film')
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          premiere=$(find archive -name 'film-noir-0000.png' | head -1)
          [ -n "$premiere" ] || { echo "=== ABSENT film"; exit 0; }
          d=$(dirname "$premiere")
          echo "Images : $(ls "$d" | grep -c '^film-noir-') noires, $(ls "$d" | grep -c '^film-blanc-') blanches"
          # « film » : les deux fonds ; « film-noir » ou « film-blanc » : un seul (journal moins lourd à relire).
          fonds="noir blanc"
          case ",$NOMS," in *,film-noir,*) fonds=noir ;; *,film-blanc,*) fonds=blanc ;; esac
          for fond in $fonds; do
            ffmpeg -loglevel error -framerate 25 -i "$d/film-$fond-%04d.png" -c:v libx264rgb -crf 10 -preset slow -pix_fmt rgb24 "$RUNNER_TEMP/film-$fond.mp4"
            echo "=== VIDEO film-$fond.mp4 $(wc -c < "$RUNNER_TEMP/film-$fond.mp4")"
            base64 -w 4000 "$RUNNER_TEMP/film-$fond.mp4" | sed 's/^/V64 /'
            echo "=== FIN VIDEO"
          done

  # Audit des images des packs (test Mi Box du 26/10 : questions Marvel du Quiz illustré sans images). Lecture seule ;
  # le journal étant public, rien que des titres de packs, des comptes et des identifiants d'images.
  audit:
    if: inputs.audit == 'packs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PRESTATION: ${{ inputs.prestation }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les images des packs
        run: |
          project=$(jq -r .projectId firebase-config.json)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          get() { npx --yes firebase-tools@13 database:get "$@" --project "$project"; }
          get /library/quizzes > "$RUNNER_TEMP/quizzes.json"
          get /library/images --shallow > "$RUNNER_TEMP/images.json"
          get /library/shows > "$RUNNER_TEMP/shows.json"
          echo "== $(jq 'keys | length' "$RUNNER_TEMP/images.json") images dans library/images =="
          echo "== Packs : questions, réponses en images, images introuvables =="
          jq -r --slurpfile img "$RUNNER_TEMP/images.json" '
            def ids: [.. | strings | select(test("^[0-9a-f]{16}$"))];
            def qs: (.questions // {}) | if type == "array" then . else [.[]] end | map(select(. != null));
            to_entries | map(select(.value.pack == true)) | sort_by(.value.title) | .[] | .key as $id | .value as $p
            | ($p | qs) as $q
            | ($q | map(select(.choiceImages != null and ([.choiceImages[]?] | map(select(test("^[0-9a-f]{16}$"))) | length) > 0)) | length) as $avec
            | ($q | map(.choiceImages // {} | [.[]?]) | flatten | map(select(type == "string" and test("^[0-9a-f]{16}$")))) as $ci
            | ($ci | map(select($img[0][.] == null))) as $manque
            | "\($p.kind // "?")  \($p.title)  [\($p.theme // "")]  questions \($q | length) · à réponses en images \($avec) · images de réponses \($ci | length), introuvables \($manque | length)\(if ($manque | length) > 0 then " ex. " + ($manque[0:3] | join(",")) else "" end) · id \($id)"
          ' "$RUNNER_TEMP/quizzes.json"
          if [ -n "$PRESTATION" ]; then
            echo
            echo "== Prestation contenant « $PRESTATION » : questions à propositions, avec ou sans images =="
            jq -r --arg mot "$PRESTATION" --slurpfile img "$RUNNER_TEMP/images.json" '
              to_entries | map(select((.value | tostring | ascii_downcase) | contains($mot | ascii_downcase))) | .[] | .value
              | [paths(objects) as $p | {p: $p, v: getpath($p)} | select(.v.choices? != null and .v.text? != null)] | .[]
              | (.v.choiceImages // null) as $c
              | "\(.p | map(tostring) | join("/") | .[0:60])  « \(.v.text | .[0:60]) »  choiceImages: \(if $c == null then "AUCUNE" else ([$c[]?] | map(if type == "string" and test("^[0-9a-f]{16}$") then (if $img[0][.] == null then "MANQUE" else "ok" end) else "-" end) | join(",")) end)"
            ' "$RUNNER_TEMP/shows.json" | head -200
          fi

  bombe:
    if: inputs.audit == 'bombe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PARTIE: ${{ inputs.prestation }}
    steps:
      - uses: actions/checkout@v4
      - name: Journal des bombes (sans noms d'équipes)
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i --no-save --silent google-auth-library@9 > /dev/null
          node .github/scripts/journal-bombe.mjs

  partie:
    if: inputs.audit == 'partie'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      MOT: ${{ inputs.prestation }}
    steps:
      - uses: actions/checkout@v4
      - name: État de la dernière partie (sans noms)
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i --no-save --silent google-auth-library@9 > /dev/null
          node .github/scripts/etat-partie.mjs

  journal:
    if: inputs.audit == 'journal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PARTIE: ${{ inputs.prestation }}
      FENETRE: ${{ inputs.quoi }}
    steps:
      - uses: actions/checkout@v4
      - name: Déroulé de la partie (sans noms)
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i --no-save --silent google-auth-library@9 > /dev/null
          node .github/scripts/journal-partie.mjs

  lire:
    if: inputs.captures == '' && inputs.audit == '' && inputs.touki == ''
    runs-on: ubuntu-24.04
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NOMBRE: ${{ inputs.nombre }}
    steps:
      - uses: actions/checkout@v4
      - name: Afficher les derniers rapports
        run: |
          case "$NOMBRE" in ''|*[!0-9]*) NOMBRE=20 ;; esac
          [ "$NOMBRE" -ge 1 ] && [ "$NOMBRE" -le 1000 ] || NOMBRE=20
          project=$(jq -r .projectId firebase-config.json)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 database:get /reports --project "$project" \
            --order-by-key --limit-to-last "$NOMBRE" > "$RUNNER_TEMP/rapports.json"
          echo "== Résumé : même message, même version, même box =="
          jq -r '[.[]?] | sort_by(.at) | group_by([.kind, .version, .device, .text]) | sort_by(.[0].at) | .[]
            | "\(length)×  \(.[0].at / 1000 | strftime("%Y-%m-%d %H:%M:%SZ")) → \(.[-1].at / 1000 | strftime("%H:%M:%SZ"))  \(.[0].version)  \(.[0].kind)  \(.[0].device)  \(.[0].text | split("\n")[0] | .[0:200])"' \
            "$RUNNER_TEMP/rapports.json"
          echo
          echo "== Plantages, en entier =="
          jq -r '[.[]?] | map(select(.kind == "crash")) | .[] | "--- \(.at / 1000 | strftime("%Y-%m-%d %H:%M:%SZ")) \(.version) \(.device)\n\(.text)"' \
            "$RUNNER_TEMP/rapports.json"

  touki:
    if: inputs.touki == 'apercu' || inputs.touki == 'ecrire' || inputs.touki == 'menage4' || inputs.touki == 'menage4ecrire'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      MODE: ${{ inputs.touki }}
      QUOI: ${{ inputs.quoi }}
    steps:
      - uses: actions/checkout@v4
      - name: Prestation de test remplie avec les packs
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i --no-save --silent google-auth-library@9 > /dev/null
          node .github/scripts/prestation-touki.mjs
