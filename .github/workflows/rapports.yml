name: Rapports de la box

# Lancement manuel : affiche les rapports envoyés par les box (chemin reports/ de la base : plantages, incidents du
# son), illisibles depuis l'appli. Rien n'est modifié dans la base.
# Avec « captures » (numéro d'un passage des tests émulateur) : affiche à la place quelques captures de ce passage,
# réduites en JPEG et encodées en base64 dans le journal, pour les relire là où l'archive des tests n'est pas
# téléchargeable.
on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre de rapports à lire, les plus récents (1 à 1000)"
        default: "20"
      captures:
        description: "Numéro d'un passage « Tests Android (émulateur TV) » dont afficher les captures (vide = les rapports)"
        default: ""
      audit:
        description: "« packs » : vérifie les images de tous les packs et d'une prestation (champ « prestation »), sans rien modifier"
        default: ""
      prestation:
        description: "Avec audit : un mot du nom de la prestation à vérifier (ses questions à réponses en images)"
        default: ""
      noms:
        description: "Captures à afficher, séparées par des virgules"
        default: "question-1,question-8-equipes,revelation,revelation-8-equipes,question-fermee,reponses-en-images,reponses-en-images-revelation,express-affirmation,zoom-mystere-question,zoom-mystere-revelation,image-floue-buzz,image-floue-revelation,juste-chiffre-question,juste-chiffre-revelation,quiz-musical-revelation,mimes-tour,mimes-6-equipes-tour"

permissions:
  contents: read

jobs:
  captures:
    if: inputs.captures != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    env:
      PASSAGE: ${{ inputs.captures }}
      NOMS: ${{ inputs.noms }}
    steps:
      - name: Vérifier le numéro du passage
        run: case "$PASSAGE" in *[!0-9]*) echo "Numéro de passage invalide" >&2; exit 1 ;; esac
      - uses: actions/download-artifact@v4
        with:
          name: tests-android-tv
          run-id: ${{ inputs.captures }}
          github-token: ${{ github.token }}
          path: archive
      - name: Afficher les captures
        run: |
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null; }
          echo "== Toutes les captures du passage =="
          find archive -name '*.png' -printf '%f\n' | sort
          # Une capture s'appelle « <Test>-<n°>-<nom>.png » ; un même nom peut venir de plusieurs tests.
          for nom in $(printf '%s' "$NOMS" | tr ',' ' '); do
            case "$nom" in *[!a-zA-Z0-9-]*) echo "Nom ignoré : $nom"; continue ;; esac
            trouve=
            for png in $(find archive -name "*-[0-9][0-9]-$nom.png" -o -name "$nom.png" | sort | head -3); do
              trouve=1
              fichier=$(basename "$png" .png)
              convert "$png" -resize '1280x>' -quality 85 "$RUNNER_TEMP/$fichier.jpg"
              echo "=== CAPTURE $fichier $(identify -format '%wx%h' "$png") $(wc -c < "$RUNNER_TEMP/$fichier.jpg")"
              base64 -w 1000 "$RUNNER_TEMP/$fichier.jpg" | sed 's/^/B64 /'
              echo "=== FIN $fichier"
            done
            [ -n "$trouve" ] || echo "=== ABSENTE $nom"
          done

  # Audit des images des packs (test Mi Box du 26/10 : questions Marvel du Quiz illustré sans images). Lecture seule ;
  # le journal étant public, rien que des titres de packs, des comptes et des identifiants d'images.
  audit:
    if: inputs.audit == 'packs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PRESTATION: ${{ inputs.prestation }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les images des packs
        run: |
          project=$(jq -r .projectId firebase-config.json)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          get() { npx --yes firebase-tools@13 database:get "$@" --project "$project"; }
          get /library/quizzes > "$RUNNER_TEMP/quizzes.json"
          get /library/images --shallow > "$RUNNER_TEMP/images.json"
          get /library/shows > "$RUNNER_TEMP/shows.json"
          echo "== $(jq 'keys | length' "$RUNNER_TEMP/images.json") images dans library/images =="
          echo "== Packs : questions, réponses en images, images introuvables =="
          jq -r --slurpfile img "$RUNNER_TEMP/images.json" '
            def ids: [.. | strings | select(test("^[0-9a-f]{16}$"))];
            def qs: (.questions // {}) | if type == "array" then . else [.[]] end | map(select(. != null));
            to_entries | map(select(.value.pack == true)) | sort_by(.value.title) | .[] | .key as $id | .value as $p
            | ($p | qs) as $q
            | ($q | map(select(.choiceImages != null and ([.choiceImages[]?] | map(select(test("^[0-9a-f]{16}$"))) | length) > 0)) | length) as $avec
            | ($q | map(.choiceImages // {} | [.[]?]) | flatten | map(select(type == "string" and test("^[0-9a-f]{16}$")))) as $ci
            | ($ci | map(select($img[0][.] == null))) as $manque
            | "\($p.kind // "?")  \($p.title)  [\($p.theme // "")]  questions \($q | length) · à réponses en images \($avec) · images de réponses \($ci | length), introuvables \($manque | length)\(if ($manque | length) > 0 then " ex. " + ($manque[0:3] | join(",")) else "" end) · id \($id)"
          ' "$RUNNER_TEMP/quizzes.json"
          if [ -n "$PRESTATION" ]; then
            echo
            echo "== Prestation contenant « $PRESTATION » : questions à propositions, avec ou sans images =="
            jq -r --arg mot "$PRESTATION" --slurpfile img "$RUNNER_TEMP/images.json" '
              to_entries | map(select((.value | tostring | ascii_downcase) | contains($mot | ascii_downcase))) | .[] | .value
              | [paths(objects) as $p | {p: $p, v: getpath($p)} | select(.v.choices? != null and .v.text? != null)] | .[]
              | (.v.choiceImages // null) as $c
              | "\(.p | map(tostring) | join("/") | .[0:60])  « \(.v.text | .[0:60]) »  choiceImages: \(if $c == null then "AUCUNE" else ([$c[]?] | map(if type == "string" and test("^[0-9a-f]{16}$") then (if $img[0][.] == null then "MANQUE" else "ok" end) else "-" end) | join(",")) end)"
            ' "$RUNNER_TEMP/shows.json" | head -200
          fi

  lire:
    if: inputs.captures == '' && inputs.audit == ''
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NOMBRE: ${{ inputs.nombre }}
    steps:
      - uses: actions/checkout@v4
      - name: Afficher les derniers rapports
        run: |
          case "$NOMBRE" in ''|*[!0-9]*) NOMBRE=20 ;; esac
          [ "$NOMBRE" -ge 1 ] && [ "$NOMBRE" -le 1000 ] || NOMBRE=20
          project=$(jq -r .projectId firebase-config.json)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 database:get /reports --project "$project" \
            --order-by-key --limit-to-last "$NOMBRE" > "$RUNNER_TEMP/rapports.json"
          echo "== Résumé : même message, même version, même box =="
          jq -r '[.[]?] | sort_by(.at) | group_by([.kind, .version, .device, .text]) | sort_by(.[0].at) | .[]
            | "\(length)×  \(.[0].at / 1000 | strftime("%Y-%m-%d %H:%M:%SZ")) → \(.[-1].at / 1000 | strftime("%H:%M:%SZ"))  \(.[0].version)  \(.[0].kind)  \(.[0].device)  \(.[0].text | split("\n")[0] | .[0:200])"' \
            "$RUNNER_TEMP/rapports.json"
          echo
          echo "== Plantages, en entier =="
          jq -r '[.[]?] | map(select(.kind == "crash")) | .[] | "--- \(.at / 1000 | strftime("%Y-%m-%d %H:%M:%SZ")) \(.version) \(.device)\n\(.text)"' \
            "$RUNNER_TEMP/rapports.json"
