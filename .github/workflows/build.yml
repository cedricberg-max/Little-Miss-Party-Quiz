name: Build et publication

# Une seule série de tests par version : la PR teste la branche ; après la fusion, main publie sans rejouer les
# tests déjà passés sur la PR (cedric, 20 octobre : pas de tests en double). « Run workflow » les rejoue à la main.
# Une PR n'est donc fusionnée qu'à jour avec main : ce qui est publié est exactement ce qui a été testé.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une PR poussée à nouveau annule la série devenue inutile ; jamais une publication sur main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  moteur:
    name: Tests du moteur de jeu
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (scores, reprise, pause, journal)
        run: ./gradlew -p engine test --stacktrace

  regles-pupitre:
    name: Tests des règles Firebase et du pupitre
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests sur l'émulateur Firebase
        run: npm test

  apk:
    name: APK Android TV
    # Aucun APK n'est publié si un test échoue (tests sautés sur main : déjà passés sur la PR).
    needs: [moteur, regles-pupitre]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de l'habillage sonore (sons jamais en double, pause, reprise)
        run: ./gradlew :tv:testReleaseUnitTest --stacktrace
      - name: Compiler l'APK
        run: ./gradlew :tv:assembleRelease --stacktrace
      - name: Renommer l'APK
        run: cp tv/build/outputs/apk/release/tv-release.apk little-miss-party-quiz-tv.apk
      # La box refuse une mise à jour d'une autre appli, d'une version plus ancienne ou signée par une
      # autre clé : on bloque ici un APK qu'elle refuserait, avant toute publication.
      - name: Vérifier l'APK (appli, versionCode, signature)
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          badging=$("$bt/aapt2" dump badging little-miss-party-quiz-tv.apk | head -1)
          echo "$badging"
          echo "$badging" | grep -q "name='com.littlemissparty.quiz.tv' versionCode='${{ github.run_number }}'" \
            || { echo "::error::Nom de package ou versionCode inattendu"; exit 1; }
          certs=$("$bt/apksigner" verify --print-certs little-miss-party-quiz-tv.apk)
          echo "$certs"
          echo "$certs" | grep -qi "SHA-256 digest: 0146199dd975cec17ba905ffb1c555726b1eabe4db6b40d24bd2767d39479b6e" \
            || { echo "::error::APK signé par une autre clé : il ne s'installerait pas par-dessus la version de la box"; exit 1; }
          # Même limite que Release.MAX_APK_BYTES : au-delà, la box refuserait la mise à jour.
          size=$(stat -c %s little-miss-party-quiz-tv.apk)
          echo "Taille de l'APK : $((size / 1000000)) Mo"
          [ "$size" -le 2147483648 ] || { echo "::error::APK de plus de 2 Go : la box refuserait la mise à jour"; exit 1; }
          [ "$size" -le 400000000 ] || echo "::warning::APK de plus de 400 Mo : prévenir cedric (place libre de la Mi Box)"
      - uses: actions/upload-artifact@v4
        with:
          name: little-miss-party-quiz-tv
          path: little-miss-party-quiz-tv.apk
          # Copie de travail seulement : chaque version publiée reste dans les Releases (espace de stockage limité).
          retention-days: 3
      - name: Publier l'APK dans les Releases GitHub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tv-v0.1.${{ github.run_number }}" little-miss-party-quiz-tv.apk \
            --title "Box TV 0.1.${{ github.run_number }}" \
            --notes "APK de l'appli TV, à installer sur la Mi Box." --latest

  publish:
    name: Publication Firebase
    needs: apk
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        id: check
        run: |
          project=$(jq -r .projectId firebase-config.json)
          webkey=$(jq -r .apiKey firebase-config.json)
          if [ -z "$project" ] || [ -z "$webkey" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Firebase pas encore configuré : publication ignorée."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "project=$project" >> "$GITHUB_OUTPUT"
          fi
      - name: Publier le pupitre et les règles
        if: steps.check.outputs.ready == 'true'
        run: |
          cp firebase-config.json web/public/firebase-config.json
          # Numéro de version du site (le même que l'APK de cette publication) : les pages ouvertes se mettent à jour.
          jq -n --arg web "0.1.${{ github.run_number }}" --arg sha "${GITHUB_SHA::7}" '{web: $web, sha: $sha}' > web/public/version.json
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting,database \
            --project "${{ steps.check.outputs.project }}" --non-interactive
      # Mise à jour depuis la TV : le dépôt est privé, la box lit donc la dernière version stable
      # (description + APK) sur l'hébergement Firebase, publié en même temps que le pupitre.
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: little-miss-party-quiz-tv
          path: apk
      - name: Préparer la mise à jour de la box (tv/latest.json)
        if: steps.check.outputs.ready == 'true'
        run: |
          vc=${{ github.run_number }}
          apk="little-miss-party-quiz-tv-$vc.apk"
          mkdir -p web/public/tv
          cp apk/little-miss-party-quiz-tv.apk "web/public/tv/$apk"
          jq -n --argjson vc "$vc" --arg name "0.1.$vc" --arg url "$apk" \
            --arg sha "$(sha256sum "web/public/tv/$apk" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "web/public/tv/$apk")" --arg notes "$(git log -1 --format=%s)" \
            '{versionCode: $vc, versionName: $name, url: $url, sha256: $sha, size: $size, notes: $notes}' \
            > web/public/tv/latest.json
          cat web/public/tv/latest.json
      # Second envoi, séparé : s'il échouait (fichiers .apk refusés hors Blaze), le pupitre et les règles
      # resteraient publiés ; la box garderait simplement sa version actuelle.
      - name: Publier la mise à jour de la box
        id: tvupdate
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting \
            --project "${{ steps.check.outputs.project }}" --non-interactive
      - name: Signaler une mise à jour non publiée
        if: steps.tvupdate.outcome == 'failure'
        run: echo "::warning::Mise à jour TV non publiée sur l'hébergement Firebase, la box ne verra pas cette version (vérifier que le projet est bien sur Blaze, qui accepte les fichiers .apk)."
