    }`,

}

const piedBras = S(add(new THREE.Mesh(new THREE.CylinderGeometry(.16, .19, .2, 64), noirLaque))); piedBras.position.set(PIVOT.x, -.1, PIVOT.z);
const ringPied = L(add(new THREE.Mesh(new THREE.TorusGeometry(.165, .008, 8, 96), additif(C.cyan, 1.6)))); ringPied.rotation.x = Math.PI / 2; ringPied.position.set(PIVOT.x, .0, PIVOT.z);
const bras = new THREE.Group(); bras.position.set(PIVOT.x, .11, PIVOT.z); scene.add(bras);
const tourelle = S(add(new THREE.Mesh(new THREE.CylinderGeometry(.07, .08, .1, 40), chrome), bras)); tourelle.position.y = -.03;
// Le tube : du pivot vers la tête (le long de -X local), légèrement coudé près de la tête.
const tubeCourbe = new THREE.CatmullRomCurve3([V(.18, .02, 0), V(0, .03, 0), V(-.6, .03, -.02), V(-1.02, .03, .03), V(-1.2, .025, .17)]);
const tube = S(add(new THREE.Mesh(new THREE.TubeGeometry(tubeCourbe, 120, .022, 20, false), chrome), bras));
const tubeNeon = L(add(new THREE.Mesh(new THREE.TubeGeometry(tubeCourbe, 120, .006, 8, false), additif(C.cyan, 1.5)), bras)); tubeNeon.position.y = .022;
const contrepoids = S(add(new THREE.Mesh(new THREE.CylinderGeometry(.065, .065, .1, 40), graphite), bras)); contrepoids.rotation.z = Math.PI / 2; contrepoids.position.set(.24, .02, 0);
const ringCP = L(add(new THREE.Mesh(new THREE.TorusGeometry(.066, .006, 8, 64), additif(C.rose, 1.6)), bras)); ringCP.rotation.y = Math.PI / 2; ringCP.position.set(.2, .02, 0);
const tete = S(add(new THREE.Mesh(new THREE.BoxGeometry(.2, .03, .085), graphite), bras)); tete.position.set(-1.25, .02, .2); tete.rotation.y = -.45;
const ledTete = L(add(new THREE.Mesh(new THREE.BoxGeometry(.16, .006, .006), additif(C.rose, 1.6)), bras)); ledTete.position.set(-1.25, .038, .2); ledTete.rotation.y = -.45;
const diamant = new THREE.Object3D(); diamant.position.set(-1.29, -.06, .22); bras.add(diamant);
const etincelle = L(add(sprite(0xff9ad8, 1.6, .2))); const etincelle2 = L(add(sprite(0xffffff, 2, .06)));
// Repose-bras.
const repos = S(add(new THREE.Mesh(new THREE.CylinderGeometry(.035, .04, .14, 24), chrome))); repos.position.set(1.3, -.04, .45);
const ANGLE_JOUE = .8, ANGLE_REPOS = 1.45;   // rotation du bras autour de Y (repos = le long du disque, sur le repose-bras)

// ---------- Image ----------
const vW = new THREE.Vector3(), vD = new THREE.Vector3(), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
// Pièces du disque (boucle vidéo) et pièces du bras (images) ; tout le reste est dessiné en direct par l'appli.
const pieceBras = [bras, piedBras, ringPied, repos];
const enDirect = [holo, ...ondes, barres, pics, ligneR, ...lasers.flatMap((l) => [l.m, l.s]), etincelle, etincelle2];
window.frame = (t, passe = "c") => {
  for (const m of enDirect) m.visible = false;
  const disqueVisible = MODE === "disque";
  for (const m of [socle, bordSocle, bordSocle2, halo, plateauD, anneauBord, vinyle, etiquette, verreL, axe, pointeAxe]) m.visible = disqueVisible;
  disque.visible = disqueVisible;
  for (const m of pieceBras) m.visible = MODE === "bras";
  // Le disque tourne à vitesse constante : deux tours en 3,64 s, toute la lumière est périodique sur cette durée.
  const ang = TAU * TOUR * t;
  disque.rotation.y = -ang;
  const u = matDisque.uniforms; u.uAng.value = ang; u.uT.value = t; u.uJoue.value = 1; u.uK.value = 0;
  const lv = MODE === "bras" ? LEVE : 0;
  const angB = lerp(ANGLE_JOUE, ANGLE_REPOS, lv);
  bras.rotation.set(0, angB, -.05 * Math.sin(Math.PI * clamp(lv)) - (lv > .02 ? .03 : 0));
  bras.updateMatrixWorld(true); diamant.getWorldPosition(vD);
  u.uDiam.value.set(Math.atan2(-vD.z, vD.x), Math.hypot(vD.x, vD.z), 1);
  window.DIAMANT = [vD.x, vD.y, vD.z];
  ledTete.material.color.set(C.rose).multiplyScalar(1.8 - .8 * lv);
  pointeAxe.material.opacity = 1;
  halo.material.color.set(C.violet).multiplyScalar(.3);
  bordSocle.material.color.set(C.rose).multiplyScalar(1.5);
  anneauBord.material.color.set(C.cyan).multiplyScalar(1.6);
  if (passe === "m") {
    const sauv = new Map();
    for (const m of lumieres) { sauv.set(m, m.visible); m.visible = false; }
    const blanc = new THREE.MeshBasicMaterial({ color: 0xffffff }); const mats = new Map();
    for (const m of solides) { mats.set(m, m.material); m.material = blanc; }
    renderer.toneMapping = THREE.NoToneMapping; renderer.render(scene, camera); renderer.toneMapping = THREE.ACESFilmicToneMapping;
    for (const [m, v] of sauv) m.visible = v; for (const [m, mt] of mats) m.material = mt;
    return;
  }
  comp.render();
};
// Projection d'un point du monde dans l'image (0..1), pour vérifier la même projection côté appli.
window.projeter = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2, (1 - v.y) / 2]; };
window.PRET = true;
